# Referendum Design Simulator — baseline scenario (Albania, 2025 data vintage)
# Every parameter: value, source, date (of the source or of the decision), optional range and note.
# The book (Engineering Albania's Referendum Law: A Design Guide) is the reference for every value; "D" codes are its modelling decisions.
scenario:
  name: baseline_2025
  description: Current law (Regime A for T1-T4, T6-T8; Regime B for T5) at the 2025 register
  data_vintage: "2025"

electorate:
  E_full:   {value: 3713761, source: "OSCE/ODIHR final report, 2025 Assembly elections (final voter lists)", date: "2025-10-23"}
  E_ocv:    {value: 245935,  source: "OSCE/ODIHR final report, 2025 (out-of-country registrants)", date: "2025-10-23"}
  R:        {value: 1920000, range: [1890000, 1950000], source: "Section II, resident adults able to vote, 2025 (INSTAT-based 1.90-1.92M on 1 Jan 2025)", date: "2025-01-01"}
  R_2023:   {value: 1930000, source: "Section II: lambda_R x census 2023", date: "2023-09-01"}
  P_cen:    {value: 2402113, source: "INSTAT census 2023", date: "2023-09-01"}
  tau_ab:   {value: 0.0, source: "F3: no out-of-country voting in referendums (registered non-residents counted in E)", date: "2026-10-12", note: "A1 allows tau_ab > 0 as a sensitivity"}
  mu_A:     {value: 0.5, source: "A1: non-resident voters split evenly", date: "2026-10-12"}
  T_dom_2025: {value: 1463314, source: "OSCE/ODIHR 2025 final report, Annex I (in-country ballots, 2025 Assembly elections)", date: "2025-05-11"}
  T_all_2025: {value: 1665501, source: "OSCE/ODIHR 2025 final report, Annex I (all ballots, 2025)", date: "2025-05-11"}
